[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qca-market-making-strategy-comparison"
version = "1.0.0"
description = "Market Making Strategy Comparison with Multiple Risk Aversion Levels"
authors = [
    {name = "OpenHands Agent", email = "agent@openhands.dev"}
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
